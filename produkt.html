<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produkt | Ariańska Selection</title>
    <meta name="description" content="Szczegóły produktu Ariańska Selection.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css?v=81">
  </head>
  <body class="commerce-page shop-page">
    <header class="commerce-topbar">
      <a class="brand" href="/" aria-label="Ariańska Selection">
        <img src="assets/logo-menu.png" alt="Ariańska Selection">
      </a>
      <div class="site-menu" aria-label="Menu strony">
        <a href="/sklep">Nowości - sklep</a>
        <a href="/warsztaty">Warsztaty</a>
      </div>
    </header>

    <main class="commerce-shell product-shell" data-product-view></main>

    <script src="assets/shop-products.js?v=1"></script>
    <script src="assets/shop-storage.js?v=1"></script>
    <script>
      (() => {
        const products = window.ARIA_SHOP_STORAGE?.allProducts() || window.ARIA_SHOP_PRODUCTS || [];
        const params = new URLSearchParams(window.location.search);
        const product = products.find((item) => item.id === params.get("id")) || products[0];
        const root = document.querySelector("[data-product-view]");
        const price = (value) => `${Number(value).toLocaleString("pl-PL")} zł`;
        const statusLabel = { available: "Dostępne", reserved: "Zarezerwowane", sold: "Sprzedane" };

        if (!product) {
          root.innerHTML = '<section class="message-panel"><h1>Brak produktu</h1><a class="button button-primary" href="/sklep">Wróć do sklepu</a></section>';
          return;
        }

        document.title = `${product.name} | Ariańska Selection`;
        root.innerHTML = `
          <nav class="breadcrumbs" aria-label="Ścieżka">
            <a href="/sklep">Sklep</a><span>/</span><strong>${product.name}</strong>
          </nav>
          <section class="product-detail">
            <div class="product-gallery-shop">
              <img class="product-main-photo" src="${product.cover}" alt="${product.name}">
              <div>
                ${product.gallery.map((src) => `<button type="button"><img src="${src}" alt=""></button>`).join("")}
              </div>
            </div>
            <article class="product-summary-shop">
              <p class="section-kicker">${product.category}</p>
              <h1>${product.name}</h1>
              <p class="product-status status-${product.status}">${statusLabel[product.status] || product.status}</p>
              <strong class="product-price">${price(product.price)}</strong>
              <p>${product.description}</p>
              <dl>
                <div><dt>Rozmiar</dt><dd>${product.size}</dd></div>
                <div><dt>Wymiary</dt><dd>${product.dimensions}</dd></div>
                <div><dt>Materiał</dt><dd>${product.material}</dd></div>
              </dl>
              <a class="button button-primary ${product.status !== "available" ? "is-disabled" : ""}" href="sklep-zamowienie.html?id=${encodeURIComponent(product.id)}">
                ${product.status === "available" ? "Kup teraz" : "Chwilowo niedostępne"}
              </a>
              <small>${product.note}</small>
            </article>
          </section>
        `;

        document.querySelectorAll(".product-gallery-shop button").forEach((button) => {
          button.addEventListener("click", () => {
            document.querySelector(".product-main-photo").src = button.querySelector("img").src;
          });
        });
      })();
    </script>
    <script src="assets/typography.js?v=1"></script>
  </body>
</html>
