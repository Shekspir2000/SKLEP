<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel testowy | Ariańska Selection</title><link rel="stylesheet" href="assets/boutique.css"></head><body data-page="admin"><header id="site-header"></header><main class="section-wrap admin-main"><div class="admin-topline"><div><p class="eyebrow">Panel testowy</p><h1>Twoja selekcja</h1></div><a class="button outline" href="sklep.html">Zobacz sklep <i data-lucide="arrow-up-right"></i></a></div><p class="test-note">Produkty zapisują się tylko w tej przeglądarce. Ten panel nie publikuje ich na LH. Ceny i rozmiary startowych produktów są testowe.</p><div class="admin-layout"><section><h2 id="form-heading">Dodaj produkt</h2><form class="admin-form" id="product-form"><label class="wide">Nazwa<input name="name" required maxlength="100"></label><label>Kategoria<select name="category"><option>Marynarki</option><option>Kurtki i płaszcze</option><option>Sukienki</option><option>Swetry</option><option>Spodnie</option><option>Spódnice</option><option>Akcesoria</option></select></label><label>Rozmiar<input name="size" required maxlength="20" placeholder="np. M"></label><label>Cena (zł)<input name="price" type="number" required min="0.01" step="0.01"></label><label>Status<select name="status"><option value="available">Dostępne</option><option value="reserved">Zarezerwowane</option><option value="sold">Sprzedane</option></select></label><fieldset class="wide tile-picker"><legend>Kafel sprzedażowy</legend><div class="tile-options" id="tile-options"></div></fieldset><section class="wide editor-preview"><h3>Podgląd kafla</h3><div class="editor-preview-frame" id="editor-preview-frame"><img id="editor-backdrop" alt="" hidden><img id="admin-preview" alt="Podgląd produktu" hidden></div><div class="preview-sides"><button type="button" data-preview-side="front" aria-pressed="true">Przód</button><button type="button" data-preview-side="back" aria-pressed="false" disabled>Tył</button></div></section><label class="wide">Zdjęcie główne (JPG, PNG, WebP)<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">Dodatkowe zdjęcie / tył<input name="back" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">Opis<textarea name="description" rows="3" maxlength="2000"></textarea></label><label>Materiał<input name="material" maxlength="120"></label><label>Wymiary<input name="dimensions" maxlength="200"></label><button class="button primary" type="submit">Zapisz produkt <i data-lucide="check"></i></button><button class="button outline" type="reset">Nowy produkt</button><p class="admin-message" role="status" id="admin-message"></p></form></section><section><div class="admin-topline"><h2>Produkty</h2><button class="text-button" id="reset-demo">Reset zakupów testowych</button></div><div class="admin-list" id="admin-list"></div></section></div></main><footer id="site-footer"></footer><script src="assets/lucide.min.js"></script><script src="assets/shop-products.js"></script><script src="assets/shop-storage.js"></script><script src="assets/boutique.js"></script><script src="assets/shop-backgrounds.js"></script><script src="assets/boutique-admin.js"></script></body></html>
